<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Misiones · Curso de ciencia de datos</title>
  <link rel="stylesheet" href="../design/tokens/tokens.css">
  <link rel="stylesheet" href="../assets/views.css">
</head>
<body>
  <main>
    <a class="standalone-back" href="../curso/?vista=misiones" hidden>← Volver a tu ruta</a>
    <section class="view-hero">
      <div>
        <div class="eyebrow">Curso de ciencia de datos · Misiones</div>
        <h1>Misiones</h1>
        <p>Cada misión es una decisión real tomada con datos. Resuélvela y desbloquea los conceptos que usaste.</p>
      </div>
      <aside class="snapshot">
        <div class="eyebrow">Cómo funciona</div>
        <strong>Caso → evidencia → decisión</strong>
        <small>Cada misión trae su notebook y su video.</small>
      </aside>
    </section>
    <section class="grid" id="missionList" aria-live="polite">
      <p class="empty" id="missionEmpty">Cargando misiones…</p>
    </section>
  </main>
  <script>
    (function () {
      var list = document.getElementById("missionList");
      var empty = document.getElementById("missionEmpty");
      function render(data) {
        var missions = (data && data.missions) || [];
        if (!missions.length) {
          empty.textContent = "Todavía no hay misiones publicadas. La primera está en preparación.";
          return;
        }
        empty.remove();
        missions.forEach(function (mission) {
          var card = document.createElement("article");
          card.className = "card story";
          card.setAttribute("data-mission-id", mission.id);
          var title = document.createElement("h2");
          title.textContent = mission.title;
          var question = document.createElement("p");
          question.textContent = mission.decision.question;
          var concepts = document.createElement("div");
          concepts.className = "chips";
          mission.concepts.forEach(function (concept) {
            var chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = concept;
            concepts.append(chip);
          });
          card.append(title, question, concepts);
          list.append(card);
        });
      }
      fetch("../missions.json")
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then(render)
        .catch(function () {
          empty.textContent = "No se pudo cargar la lista de misiones. Recarga la página.";
        });
    })();
  </script>
<script>if (window.top === window.self) document.querySelector(".standalone-back").hidden = false;</script>
</body>
</html>
