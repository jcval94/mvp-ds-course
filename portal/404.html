<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Curso de ciencia de datos</title>
  <style>
    /* Estilos en línea: esta página puede servirse desde cualquier ruta, así que no depende de assets relativos. */
    html, body { margin: 0; min-height: 100%; background: #080d13; color: #eef6ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; display: grid; gap: 14px; }
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #66d9ff; font-weight: 800; }
    h1 { margin: 0; font-size: 32px; }
    p { margin: 0; color: #8395a8; line-height: 1.6; }
    button { justify-self: start; background: #66d9ff; color: #07121a; border: 0; border-radius: 11px; padding: 10px 15px; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté incompleto o que la página haya cambiado de lugar.</p>
    <button type="button" onclick="history.back()">Regresar</button>
  </main>
</body>
</html>
