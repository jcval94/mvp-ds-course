<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · The Agentic D. Scientist</title>
  <style>
    /* Estilos en línea (valores de design/tokens): esta página puede servirse desde cualquier ruta, así que no depende de assets relativos. */
    html, body { margin: 0; min-height: 100%; background: #faf8f5; color: #0e0a07; font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; display: grid; gap: 14px; }
    .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #94600f; font-weight: 700; }
    h1 { margin: 0; font-size: 32px; }
    p { margin: 0; color: #6b5a4d; line-height: 1.6; }
    button { justify-self: start; background: #fdaa3e; color: #1a1a1a; border: 0; border-radius: 16px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté incompleto o que la página haya cambiado de lugar.</p>
    <button type="button" onclick="history.back()">Regresar</button>
  </main>
</body>
</html>
