# Capa de deployment: Cloudflare Pages (sitio oficial https://learninglabs.pages.dev).
# Publica el artefacto dist/ ya probado (no construye nada) y las Pages Functions de deploy/cloudflare/functions.
# Requiere los secrets CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit) y
# CLOUDFLARE_ACCOUNT_ID. Mientras no existan, el job avisa y termina sin fallar.
name: Deploy · Cloudflare Pages

on:
  workflow_call:
    inputs:
      project-name:
        description: Nombre del proyecto en Cloudflare Pages (define <nombre>.pages.dev)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: https://${{ inputs.project-name }}.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ inputs.project-name }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Cloudflare Pages sin credenciales::Agrega CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings → Secrets → Actions. No se desplegó a Cloudflare."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download dist/
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      # Pages Functions (puerta de los niveles de pago): viven fuera de dist/ y se publican con él.
      - name: Checkout Pages Functions
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: deploy/cloudflare/functions
          path: repo

      - name: Place Pages Functions
        if: steps.creds.outputs.ready == 'true'
        run: |
          cp -r repo/deploy/cloudflare/functions functions
          find functions -type f

      - name: Verify token and ensure the Pages project exists
        if: steps.creds.outputs.ready == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          fail() { echo "::error title=$1::$2"; exit 1; }
          errors() { jq -c '[.errors[]? | {code, message}]' "$1" 2>/dev/null || cat "$1"; }

          # 1) El token es válido (token de cuenta o de usuario).
          code=$(curl -sS -o verify.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$code" != "200" ]; then
            code=$(curl -sS -o verify.json -w '%{http_code}' "${auth[@]}" "$api/user/tokens/verify")
          fi
          [ "$code" = "200" ] || fail "Token de Cloudflare inválido" "HTTP $code $(errors verify.json). Revisa que CLOUDFLARE_API_TOKEN esté completo, sin espacios, y que no haya expirado."
          echo "Token válido: $(jq -r '.result.status' verify.json)"

          # 2) El token alcanza Pages en esta cuenta.
          code=$(curl -sS -o project.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          case "$code" in
            200) echo "El proyecto $PROJECT ya existe." ;;
            404)
              echo "Creando el proyecto $PROJECT…"
              code=$(curl -sS -o project.json -w '%{http_code}' "${auth[@]}" -X POST \
                "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
                --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}")
              [ "$code" = "200" ] || fail "No se pudo crear el proyecto de Pages" "HTTP $code $(errors project.json)"
              ;;
            401|403) fail "El token no tiene acceso a Pages en esta cuenta" "HTTP $code $(errors project.json). Revisa que el token tenga Cloudflare Pages · Edit y que CLOUDFLARE_ACCOUNT_ID sea el de la misma cuenta." ;;
            *) fail "Respuesta inesperada de Cloudflare" "HTTP $code $(errors project.json). Revisa CLOUDFLARE_ACCOUNT_ID (32 caracteres hexadecimales)." ;;
          esac

          # 3) El subdominio asignado es el oficial.
          subdomain=$(jq -r '.result.subdomain' project.json)
          echo "Subdominio asignado: $subdomain"
          [ "$subdomain" = "$PROJECT.pages.dev" ] || fail "Cloudflare asignó otro subdominio" "Se esperaba $PROJECT.pages.dev y se obtuvo $subdomain (el nombre está ocupado en otra cuenta)."

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main \
               --commit-hash="$GITHUB_SHA" --commit-dirty=true 2>&1 | tee wrangler.log; then
            msg=$(grep -iE 'error|✘' wrangler.log | tail -5 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Falló wrangler pages deploy::${msg:-revisa el log del paso}"
            exit 1
          fi

      - name: Verify the official URL serves this commit
        if: steps.creds.outputs.ready == 'true'
        run: |
          url="https://$PROJECT.pages.dev/build-info.json"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" -o build-info.json && grep -q "$GITHUB_SHA" build-info.json; then
              echo "OK: $url sirve el commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url no sirve el commit $GITHUB_SHA. Si Cloudflare asignó otro subdominio (nombre ocupado), revisa el proyecto en el panel."
          cat build-info.json 2>/dev/null || true
          exit 1

      - name: Verify paid levels are gated
        if: steps.creds.outputs.ready == 'true'
        run: |
          base="https://$PROJECT.pages.dev"
          gratis=$(curl -s -o /dev/null -w '%{http_code}' "$base/labs/level-1/")
          pago=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$base/labs/level-3/")
          echo "nivel 1: $gratis · nivel 3 sin sesión: $pago"
          [ "$gratis" = "200" ] || { echo "::error::El nivel 1 (gratis) no responde 200"; exit 1; }
          case "$pago" in
            "302 "*"/acceso?"*) echo "OK: el nivel 3 sin sesión manda a /acceso" ;;
            *) echo "::error title=Niveles de pago abiertos::/labs/level-3/ sin sesión respondió $pago (se esperaba 302 a /acceso)"; exit 1 ;;
          esac
