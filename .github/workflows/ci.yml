# Workflow principal. Orquesta los dominios con reusable workflows y despliega dist/.
# Cambiar de proveedor de hosting = cambiar solo el job `deploy` (ver docs/architecture/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  factory:
    name: Fábrica de niveles
    uses: ./.github/workflows/factory.yml

  capsulas:
    name: Cápsulas
    uses: ./.github/workflows/capsulas.yml

  portal:
    name: Portal portable (dist/)
    needs: [factory, capsulas]
    uses: ./.github/workflows/portal.yml

  deploy:
    name: Deployment · GitHub Pages (redirección)
    needs: portal
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-github-pages.yml
    # GitHub Pages ya solo redirige a learninglabs.pages.dev (misma ruta); el sitio oficial es Cloudflare.

  deploy-cloudflare:
    name: Deployment · Cloudflare Pages (oficial)
    needs: portal
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-cloudflare-pages.yml
    with:
      project-name: learninglabs
    secrets: inherit
