# Audit one-off for the current review. Remove after capturing evidence.
name: A11Y diagnostic review
on:
  push:
    branches: [audit/a11y-axe-keyboard-20261024]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser and pinned engine
        run: |
          python -m pip install -r harness/requirements.txt
          python -m playwright install --with-deps chromium
          npm install --prefix harness/a11y --no-save --no-package-lock --ignore-scripts axe-core@4.10.3
      - name: Build dist
        run: python -m harness build
      - name: Axe before/after and keyboard review
        env:
          A11Y_COMPARE: '1'
        run: python -m harness smoke --base-path /
      - name: Save report on success or failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-diagnostic
          path: output/a11y/
          retention-days: 14
