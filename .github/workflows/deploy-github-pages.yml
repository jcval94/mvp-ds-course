# Capa de deployment: GitHub Pages ya no publica el portal: solo redirige al sitio oficial
# (learninglabs.pages.dev) conservando la ruta, la consulta y el ancla. Ver docs/architecture/DEPLOYMENT.md.
name: Deploy · GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist/
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Checkout (solo el generador de redirecciones)
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/redireccion_pages.py
          sparse-checkout-cone-mode: false
          path: repo

      - name: Build redirect site
        run: python3 repo/scripts/redireccion_pages.py dist redirect https://learninglabs.pages.dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages permaneció en deployment_queued más que el límite predeterminado
          # de 10 minutos en tres ejecuciones consecutivas (heredado de pages.yml).
          timeout: 1200000
